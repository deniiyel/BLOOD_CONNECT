name: blood_donation_user_app
description: Blood Donation User App - Connecting donors with recipients in real-time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # State Management
  provider: ^6.1.1

  # UI & Fonts
  # google_fonts downloads Poppins at runtime (no local .ttf needed).
  # For offline/production, bundle fonts via: flutter pub run google_fonts:build
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
